<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Note App</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      margin: 0;
      padding: 30px;
      color: #333;
    }

    h1 {
      font-size: 32px;
      margin-bottom: 20px;
    }

    h4 {
      font-weight: 500;
      color: #666;
      margin-bottom: 10px;
    }

    label {
      display: block;
      margin: 12px 0 6px;
      font-size: 14px;
    }

    input[type="text"],
    textarea {
      width: 100%;
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 6px;
      outline: none;
      background: #fff;
      font-size: 14px;
    }

    input[type="text"]:focus,
    textarea:focus {
      border-color: #0d6efd;
    }

    .checkbox {
      margin-top: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
    }

    button {
      margin-top: 15px;
      background: #0d6efd;
      color: white;
      padding: 10px 16px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }

    button:hover {
      background: #0b5ed7;
    }

    .notes {
      margin-top: 25px;
    }

    .note-box {
      background: #fff;
      border: 1px solid #e5e5e5;
      padding: 10px;
      border-radius: 6px;
      margin-top: 10px;
    }
  </style>
</head>

<body>

  <h4>WELCOME TO NOTE APP</h4>
  <h1>Create a New Note</h1>

  <form>
    <label>Note Title</label>
    <input type="text" placeholder="Enter title">

    <label>Note Description</label>
    <textarea rows="5" placeholder="Write your note..."></textarea>

    <div class="checkbox">
      <input type="checkbox" id="check">
      <label for="check">Check me out</label>
    </div>

    <button type="submit">Submit</button>
  </form>

  <div class="notes">
    <h2>Your Notes</h2>

    <div class="note-box">
      No notes to display
    </div>
  </div>

</body>
</html>
